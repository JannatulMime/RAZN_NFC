name: Build RAZN NFC app
'on':
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
jobs:
  build_with_signing:
    runs-on: macos-latest
    steps:
      - name: check Xcode version
        run: /usr/bin/xcodebuild -version
      - name: checkout repository
        uses: actions/checkout@v3
      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: '${{ secrets.IOS_P12_BASE64 }}'
          P12_PASSWORD: '${{ secrets.IOS_P12_PASSWORD }}'
          BUILD_PROVISION_PROFILE_BASE64: '${{ secrets.IOS_MOBILEPROVISION_BASE64 }}'
          KEYCHAIN_PASSWORD: '${{ secrets.KEYCHAIN_PASSWORD }}'
        run: >
          # create variables

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12

          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision

          
          PROFILE_UUID=$( /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <(security cms -D -i "$PP_PATH") )
          echo "Using provisioning profile UUID: $PROFILE_UUID"


          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db


          # import certificate and provisioning profile from secrets

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o
          $CERTIFICATE_PATH

          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o
          $PP_PATH


          # create temporary keychain

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH


          # import certificate to keychain

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f
          pkcs12 -k $KEYCHAIN_PATH

          security list-keychain -d user -s $KEYCHAIN_PATH


          # apply provisioning profile

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
      - name: build archive
        run: |
          xcodebuild -scheme "RAZNNFC" \
          -archivePath $RUNNER_TEMP/RAZNNFC.xcarchive \
          -sdk iphoneos \
          -configuration Release \
          -destination generic/platform=iOS \
          DEVELOPMENT_TEAM=H552WM8224 \
          CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER=com.razvanVladutChiricia.RAZNNFC \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            clean archive
      - name: export ipa
        env:
          EXPORT_OPTIONS_PLIST: '${{ secrets.EXPORT_OPTIONS_PLIST }}'
        run: >
          EXPORT_OPTS_PATH=$RUNNER_TEMP/ExportOptions.plist

          echo -n "$EXPORT_OPTIONS_PLIST" | base64 --decode -o $EXPORT_OPTS_PATH

          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/RAZNNFC.xcarchive
          -exportOptionsPlist $EXPORT_OPTS_PATH -exportPath $RUNNER_TEMP/build
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: '${{ runner.temp }}/build/*.ipa'
          retention-days: 3
